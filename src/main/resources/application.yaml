spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  main:
    log-startup-info: ${LOG_STARTUP_INFO}
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED}
    change-log: classpath:db/changelog/changelog.yaml
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_JDBC}://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT}/${SPRING_DATASOURCE_NAME}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}
    properties:
      transaction:
        jta:
          platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
    show-sql: ${SHOW_SQL}
    open-in-view: ${OPEN_IN_VIEW}

# swagger-ui custom path
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: ${SHOW_ACTUATOR}

server:
  port: ${SERVER_PORT}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT} # TRACE, DEBUG, INFO, WARN, ERROR, FATAL
  file:
    path: ${LOGGING_FILE_PATH}
    name: ${LOGGING_FILE_NAME}

vocabulary:
  url-base: "https://www.oxfordlearnersdictionaries.com/definition/english/"

management:
  endpoints:
    web:
      exposure:
        include: ${INCLUDE}
  endpoint:
    health:
      show-details: ${SHOW_DETAILS}

app:
  cors:
    allowed-origin-patterns: "http://localhost:5173,http://127.0.0.1:5173"
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "Authorization,Content-Type,Accept,X-Requested-With,Origin"
    exposed-headers: "Authorization,Content-Type"
    allow-credentials: true
    max-age: 3600
    