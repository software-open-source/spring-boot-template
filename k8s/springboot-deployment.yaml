apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-template
  namespace: spring-boot-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-template
  template:
    metadata:
      labels:
        app: spring-boot-template
    spec:
      automountServiceAccountToken: false
      containers:
        - name: spring-boot-template
          image: richardvuwork123/spring-boot-template:production-43107d4
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: spring-boot-template-config
            - secretRef:
                name: spring-boot-template-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "2Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-template
  namespace: spring-boot-template
spec:
  selector:
    app: spring-boot-template
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-template-nodeport
  namespace: spring-boot-template
spec:
  selector:
    app: spring-boot-template
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
